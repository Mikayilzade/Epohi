name: Context Review Temporary Check

on:
  push:
    branches:
      - codex/context-review-cleanup-v1
    paths:
      - .github/workflows/context-review-temp.yml
      - src/humans-context-review-cleanup.js
      - index.html
      - sw.js
      - tests/context-review-cleanup.spec.js
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check JavaScript syntax
        run: |
          node --check src/humans-context-review-cleanup.js
          node --check tests/context-review-cleanup.spec.js
          node --check sw.js

      - name: Run context review tests
        id: focused
        run: npx playwright test tests/context-review-cleanup.spec.js --reporter=line

      - name: Run full smoke suite
        if: steps.focused.outcome == 'success'
        run: npm run test:smoke -- --reporter=line

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-review-test-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
