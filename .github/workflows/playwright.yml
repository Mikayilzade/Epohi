name: Epohi Permanent Playwright Gate

on:
  push:
    paths:
      - .github/workflows/playwright.yml
      - playwright.config.js
      - package.json
      - package-lock.json
      - src/**
      - tests/**
      - index.html
      - sw.js
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: epohi-playwright-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Heavy browser jobs are selected by the newly pushed change range. Docs-only
# synchronizations still get a lightweight classifier, but skip Playwright.
jobs:
  classify-change:
    name: Classify CI scope
    runs-on: ubuntu-latest
    outputs:
      run_heavy: ${{ steps.scope.outputs.run_heavy }}
      reason: ${{ steps.scope.outputs.reason }}

    steps:
      - name: Checkout PR head for change classification
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Decide whether heavy Playwright is needed
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail

          # Manual runs and relevant push events always execute the full gate.
          # The push trigger is already path-filtered above.
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual-or-relevant-push" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Opening/reopening/marking ready must establish a complete baseline.
          if [[ "$EVENT_ACTION" != "synchronize" ]]; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            echo "reason=pull-request-baseline" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # For synchronize events, classify only the newly pushed range.
          # If GitHub does not provide a usable range, fail safe and run heavy.
          if [[ -z "${BEFORE_SHA:-}" || -z "${AFTER_SHA:-}" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            echo "reason=missing-sync-range-fail-safe" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null || ! git cat-file -e "${AFTER_SHA}^{commit}" 2>/dev/null; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            echo "reason=sync-range-unavailable-fail-safe" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
          printf '%s\n' "$changed_files"

          if printf '%s\n' "$changed_files" | grep -Eq '^(src/|tests/|\.github/workflows/playwright\.yml$|playwright\.config\.js$|package\.json$|package-lock\.json$|index\.html$|sw\.js$)'; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            echo "reason=runtime-test-or-ci-change" >> "$GITHUB_OUTPUT"
          else
            echo "run_heavy=false" >> "$GITHUB_OUTPUT"
            echo "reason=docs-or-checkpoint-only" >> "$GITHUB_OUTPUT"
          fi

      - name: Report CI scope
        run: |
          echo "Heavy Playwright: ${{ steps.scope.outputs.run_heavy }}"
          echo "Reason: ${{ steps.scope.outputs.reason }}"

  regression:
    name: Focused + full cross-browser regression
    needs: classify-change
    if: needs.classify-change.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Static integrity
        shell: bash
        run: |
          set -euo pipefail
          find src tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check playwright.config.js
          node --check sw.js
          git diff --check HEAD^ HEAD

      - name: Focused mobile runtime — Chromium and WebKit
        shell: bash
        run: |
          set +e
          tests=(
            tests/runtime-invalidation.spec.js
            tests/runtime-invalidation-cadence.spec.js
            tests/turn-label-idempotence.spec.js
            tests/legacy-observer-containment.spec.js
            tests/explicit-legacy-refresh-bridge.spec.js
            tests/mobile-performance-stability.spec.js
            tests/observer-startup-attribution.spec.js
            tests/observer-delivery-latency.spec.js
            tests/coherence-capture-learning.spec.js
            tests/diplomacy-activity-events.spec.js
            tests/context-review-cleanup.spec.js
            tests/humans-strategy-ux.spec.js
            tests/combat-world-stability.spec.js
          )

          npx playwright test "${tests[@]}" --project=chromium-mobile --reporter=line --timeout=20000 --workers=1 --max-failures=20 2>&1 | tee focused-chromium.txt
          chromium_code=${PIPESTATUS[0]}

          npx playwright test "${tests[@]}" --project=webkit-mobile --reporter=line --timeout=20000 --workers=1 --max-failures=20 2>&1 | tee focused-webkit.txt
          webkit_code=${PIPESTATUS[0]}

          if [ "$chromium_code" -ne 0 ] || [ "$webkit_code" -ne 0 ]; then
            exit 1
          fi

      - name: Full mobile regression — Chromium and WebKit
        shell: bash
        run: |
          set +e

          npx playwright test --grep-invert @soak --project=chromium-mobile --reporter=line --workers=1 --max-failures=30 2>&1 | tee full-chromium.txt
          chromium_code=${PIPESTATUS[0]}

          npx playwright test --grep-invert @soak --project=webkit-mobile --reporter=line --workers=1 --max-failures=30 2>&1 | tee full-webkit.txt
          webkit_code=${PIPESTATUS[0]}

          if [ "$chromium_code" -ne 0 ] || [ "$webkit_code" -ne 0 ]; then
            exit 1
          fi

      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epohi-regression-results
          path: |
            focused-chromium.txt
            focused-webkit.txt
            full-chromium.txt
            full-webkit.txt
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  soak-chromium:
    name: Autonomous soak — Chromium long matrix
    needs: classify-change
    if: needs.classify-change.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Autonomous soak — Chromium long matrix
        run: EPOHI_SOAK_MODE=long npx playwright test tests/autonomous-soak.spec.js --project=chromium-mobile --reporter=line --workers=1

      - name: Upload Chromium soak diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epohi-soak-chromium
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  soak-webkit:
    name: Autonomous soak — WebKit representative matrix
    needs: classify-change
    if: needs.classify-change.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      - name: Autonomous soak — WebKit representative matrix
        run: EPOHI_SOAK_MODE=short npx playwright test tests/autonomous-soak.spec.js --project=webkit-mobile --reporter=line --workers=1

      - name: Upload WebKit soak diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epohi-soak-webkit
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
