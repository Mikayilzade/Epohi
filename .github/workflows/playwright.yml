name: Epohi Permanent Playwright Gate

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/playwright.yml
      - playwright.config.js
      - package.json
      - package-lock.json
      - src/**
      - tests/**
      - index.html
      - sw.js
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: epohi-playwright-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# CI is risk-based. Feature-branch pushes are validated by the PR event only,
# avoiding duplicate push + pull_request heavy runs for the same commit.
jobs:
  classify-change:
    name: Classify CI scope
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.scope.outputs.tier }}
      reason: ${{ steps.scope.outputs.reason }}
      run_static: ${{ steps.scope.outputs.run_static }}
      run_focused: ${{ steps.scope.outputs.run_focused }}
      run_focused_webkit: ${{ steps.scope.outputs.run_focused_webkit }}
      run_full: ${{ steps.scope.outputs.run_full }}
      run_soak: ${{ steps.scope.outputs.run_soak }}
      focused_tests_json: ${{ steps.scope.outputs.focused_tests_json }}
      run_selector_checks: ${{ steps.scope.outputs.run_selector_checks }}

    steps:
      - name: Checkout exact revision for classification
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Decide risk tier and test scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          fail_safe='{"tier":3,"reason":"selector-fail-safe:workflow-or-range-error","runStatic":true,"runSelectorChecks":true,"runFocused":false,"runFocusedWebKit":false,"runFull":true,"runSoak":true,"focusedTests":[]}'

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            plan='{"tier":4,"reason":"final-or-main-gate","runStatic":true,"runSelectorChecks":true,"runFocused":false,"runFocusedWebKit":false,"runFull":true,"runSoak":true,"focusedTests":[]}'
          else
            if [[ "$EVENT_ACTION" == "synchronize" ]]; then
              base_sha="${BEFORE_SHA:-}"
              head_sha="${AFTER_SHA:-}"
            else
              base_sha="${PR_BASE_SHA:-}"
              head_sha="${PR_HEAD_SHA:-}"
            fi

            if [[ -z "$base_sha" || -z "$head_sha" || "$base_sha" =~ ^0+$ ]] ||
               ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null ||
               ! git cat-file -e "${head_sha}^{commit}" 2>/dev/null; then
              plan="$fail_safe"
            else
              mapfile -d '' changed_paths < <(git diff --name-only -z "$base_sha" "$head_sha")
              if [[ "${#changed_paths[@]}" -eq 0 ]]; then
                plan='{"tier":0,"reason":"empty-change-range","runStatic":false,"runSelectorChecks":false,"runFocused":false,"runFocusedWebKit":false,"runFull":false,"runSoak":false,"focusedTests":[]}'
              else
                plan="$(node scripts/map-ci-test-plan.js "${changed_paths[@]}")" || plan="$fail_safe"
                if ! PLAN="$plan" node -e 'const p=JSON.parse(process.env.PLAN); if (!p || !Array.isArray(p.focusedTests)) process.exit(1)' 2>/dev/null; then
                  plan="$fail_safe"
                fi
              fi
            fi
          fi

          PLAN="$plan" node <<'NODE'
          const fs = require('node:fs');
          const plan = JSON.parse(process.env.PLAN);
          const fields = {
            tier: plan.tier,
            reason: String(plan.reason).replace(/[\r\n]/g, ' '),
            run_static: plan.runStatic,
            run_selector_checks: plan.runSelectorChecks,
            run_focused: plan.runFocused,
            run_focused_webkit: plan.runFocusedWebKit,
            run_full: plan.runFull,
            run_soak: plan.runSoak,
            focused_tests_json: JSON.stringify(plan.focusedTests)
          };
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            Object.entries(fields).map(([key, value]) => `${key}=${value}\n`).join(''));
          NODE

      - name: Report CI scope
        run: |
          echo "Tier: ${{ steps.scope.outputs.tier }}"
          echo "Reason: ${{ steps.scope.outputs.reason }}"
          echo "Static: ${{ steps.scope.outputs.run_static }}"
          echo "Focused: ${{ steps.scope.outputs.run_focused }}"
          echo "Focused WebKit: ${{ steps.scope.outputs.run_focused_webkit }}"
          echo "Full: ${{ steps.scope.outputs.run_full }}"
          echo "Soak: ${{ steps.scope.outputs.run_soak }}"
          echo 'Focused tests: ${{ steps.scope.outputs.focused_tests_json }}'
          echo "Selector checks: ${{ steps.scope.outputs.run_selector_checks }}"

  static-checks:
    name: Static integrity
    needs: classify-change
    if: needs.classify-change.outputs.run_static == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Syntax and diff integrity
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          find src tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check playwright.config.js
          node --check sw.js
          node --check scripts/select-tests.js
          node --check scripts/map-ci-test-plan.js
          if [[ "${{ needs.classify-change.outputs.run_selector_checks }}" == "true" ]]; then
            node --test tests/test-selection.contract.test.js
          fi
          if [[ -n "${PR_BASE_SHA:-}" ]] && git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "$PR_BASE_SHA" HEAD
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          fi

  focused-browser:
    name: Focused browser regression
    needs: [classify-change, static-checks]
    if: needs.classify-change.outputs.run_focused == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install WebKit when browser-sensitive
        if: needs.classify-change.outputs.run_focused_webkit == 'true'
        run: npx playwright install --with-deps webkit

      - name: Focused Chromium
        shell: bash
        env:
          FOCUSED_TESTS_JSON: ${{ needs.classify-change.outputs.focused_tests_json }}
        run: |
          set -euo pipefail
          mapfile -t tests < <(node -e 'for (const value of JSON.parse(process.env.FOCUSED_TESTS_JSON)) console.log(value)')
          npx playwright test "${tests[@]}" --project=chromium-mobile --reporter=line --timeout=20000 --workers=1 --max-failures=20 2>&1 | tee focused-chromium.txt

      - name: Focused WebKit
        if: needs.classify-change.outputs.run_focused_webkit == 'true'
        shell: bash
        env:
          FOCUSED_TESTS_JSON: ${{ needs.classify-change.outputs.focused_tests_json }}
        run: |
          set -euo pipefail
          mapfile -t tests < <(node -e 'for (const value of JSON.parse(process.env.FOCUSED_TESTS_JSON)) console.log(value)')
          npx playwright test "${tests[@]}" --project=webkit-mobile --reporter=line --timeout=20000 --workers=1 --max-failures=20 2>&1 | tee focused-webkit.txt

      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epohi-focused-results
          path: |
            focused-chromium.txt
            focused-webkit.txt
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  full-regression:
    name: Full Chromium + WebKit regression
    needs: [classify-change, static-checks]
    if: needs.classify-change.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Full mobile regression — Chromium and WebKit
        shell: bash
        run: |
          set +e

          npx playwright test --grep-invert @soak --project=chromium-mobile --reporter=line --workers=1 --max-failures=30 2>&1 | tee full-chromium.txt
          chromium_code=${PIPESTATUS[0]}

          npx playwright test --grep-invert @soak --project=webkit-mobile --reporter=line --workers=1 --max-failures=30 2>&1 | tee full-webkit.txt
          webkit_code=${PIPESTATUS[0]}

          if [ "$chromium_code" -ne 0 ] || [ "$webkit_code" -ne 0 ]; then
            exit 1
          fi

      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epohi-regression-results
          path: |
            full-chromium.txt
            full-webkit.txt
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  soak-chromium:
    name: Autonomous soak — Chromium long matrix
    needs: [classify-change, static-checks]
    if: needs.classify-change.outputs.run_soak == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Autonomous soak — Chromium long matrix
        run: EPOHI_SOAK_MODE=long npx playwright test tests/autonomous-soak.spec.js --project=chromium-mobile --reporter=line --workers=1

      - name: Upload Chromium soak diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epohi-soak-chromium
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  soak-webkit:
    name: Autonomous soak — WebKit representative matrix
    needs: [classify-change, static-checks]
    if: needs.classify-change.outputs.run_soak == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      - name: Autonomous soak — WebKit representative matrix
        run: EPOHI_SOAK_MODE=short npx playwright test tests/autonomous-soak.spec.js --project=webkit-mobile --reporter=line --workers=1

      - name: Upload WebKit soak diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epohi-soak-webkit
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
