name: Epohi Autonomous Cross-Browser Gate

on:
  push:
    branches:
      - codex/coherence-capture-learning-v1
    paths:
      - playwright.config.js
      - package.json
      - package-lock.json
      - src/**
      - tests/**
      - index.html
      - sw.js
  workflow_dispatch:

concurrency:
  group: epohi-autonomy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Static integrity
        shell: bash
        run: |
          set -euo pipefail
          find src tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check playwright.config.js
          node --check sw.js
          git diff --check HEAD^ HEAD

      - name: Focused mobile runtime — Chromium and WebKit
        shell: bash
        run: |
          set +e
          tests=(
            tests/mobile-performance-stability.spec.js
            tests/coherence-capture-learning.spec.js
            tests/diplomacy-activity-events.spec.js
            tests/context-review-cleanup.spec.js
            tests/humans-strategy-ux.spec.js
            tests/combat-world-stability.spec.js
          )

          npx playwright test "${tests[@]}" --project=chromium-mobile --reporter=line --timeout=20000 --workers=4 --max-failures=20 2>&1 | tee focused-chromium.txt
          chromium_code=${PIPESTATUS[0]}

          npx playwright test "${tests[@]}" --project=webkit-mobile --reporter=line --timeout=20000 --workers=2 --max-failures=20 2>&1 | tee focused-webkit.txt
          webkit_code=${PIPESTATUS[0]}

          echo "Chromium focused exit: $chromium_code"
          echo "WebKit focused exit: $webkit_code"
          if [ "$chromium_code" -ne 0 ] || [ "$webkit_code" -ne 0 ]; then
            exit 1
          fi

      - name: Full mobile regression — Chromium and WebKit
        shell: bash
        run: |
          set +e

          npx playwright test --project=chromium-mobile --reporter=line --workers=4 --max-failures=30 2>&1 | tee full-chromium.txt
          chromium_code=${PIPESTATUS[0]}

          npx playwright test --project=webkit-mobile --reporter=line --workers=2 --max-failures=30 2>&1 | tee full-webkit.txt
          webkit_code=${PIPESTATUS[0]}

          echo "Chromium full exit: $chromium_code"
          echo "WebKit full exit: $webkit_code"
          if [ "$chromium_code" -ne 0 ] || [ "$webkit_code" -ne 0 ]; then
            exit 1
          fi

      - name: Upload cross-browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epohi-autonomous-cross-browser-results
          path: |
            focused-chromium.txt
            focused-webkit.txt
            full-chromium.txt
            full-webkit.txt
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

# Branch-only autonomy gate for PR #84. Pushes that only update autonomy/status docs do not trigger CI.
# Remove this temporary workflow before final merge into prototype/humans-v1.
