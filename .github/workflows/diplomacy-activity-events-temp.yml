name: Coherence Capture Learning Temporary Check

on:
  pull_request:
    branches:
      - prototype/humans-v1
  push:
    branches:
      - codex/coherence-capture-learning-v1
    paths:
      - .github/workflows/diplomacy-activity-events-temp.yml
      - src/humans-worker-learning.js
      - src/humans-capture-state.js
      - src/humans-diplomacy-coherence-v2.js
      - src/humans-coherence-finalize.js
      - src/humans-diplomacy-event-flow.js
      - src/humans-event-overlay-policy.js
      - src/humans-chronicle-ui.js
      - index.html
      - sw.js
      - tests/coherence-capture-learning.spec.js
      - tests/diplomacy-activity-events.spec.js
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check JavaScript syntax
        run: |
          node --check src/humans-worker-learning.js
          node --check src/humans-capture-state.js
          node --check src/humans-diplomacy-coherence-v2.js
          node --check src/humans-coherence-finalize.js
          node --check src/humans-diplomacy-event-flow.js
          node --check src/humans-event-overlay-policy.js
          node --check src/humans-chronicle-ui.js
          node --check tests/coherence-capture-learning.spec.js
          node --check tests/diplomacy-activity-events.spec.js
          node --check sw.js

      - name: Run focused tests
        run: npx playwright test tests/coherence-capture-learning.spec.js tests/diplomacy-activity-events.spec.js tests/context-review-cleanup.spec.js tests/humans-strategy-ux.spec.js tests/combat-world-stability.spec.js --reporter=line

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coherence-capture-learning-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

# Temporary branch-only workflow. Remove before merging the tested patch into prototype/humans-v1.
