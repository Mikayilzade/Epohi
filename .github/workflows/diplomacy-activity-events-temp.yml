name: Diplomacy Activity Events Temporary Check

on:
  push:
    branches:
      - codex/diplomacy-activity-events-v3
    paths:
      - .github/workflows/diplomacy-activity-events-temp.yml
      - src/humans-diplomacy-event-flow.js
      - src/humans-event-overlay-policy.js
      - index.html
      - sw.js
      - tests/diplomacy-activity-events.spec.js
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check JavaScript syntax
        run: |
          node --check src/humans-diplomacy-event-flow.js
          node --check src/humans-event-overlay-policy.js
          node --check tests/diplomacy-activity-events.spec.js
          node --check sw.js

      - name: Run focused tests
        run: npx playwright test tests/diplomacy-activity-events.spec.js tests/context-review-cleanup.spec.js tests/humans-strategy-ux.spec.js tests/combat-world-stability.spec.js --reporter=line

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diplomacy-activity-events-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
