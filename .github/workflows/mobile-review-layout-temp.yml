name: Mobile Review Layout Temporary Check

on:
  push:
    branches:
      - codex/mobile-review-layout-v2
    paths:
      - .github/workflows/mobile-review-layout-temp.yml
      - src/humans-context-review-cleanup.js
      - sw.js
      - tests/context-review-cleanup.spec.js
      - tests/humans-strategy-ux.spec.js
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check JavaScript syntax
        run: |
          node --check src/humans-context-review-cleanup.js
          node --check tests/context-review-cleanup.spec.js
          node --check sw.js

      - name: Run mobile review tests
        run: npx playwright test tests/context-review-cleanup.spec.js tests/humans-strategy-ux.spec.js --reporter=line
